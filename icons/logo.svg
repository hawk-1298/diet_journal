<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Logo dell'app: anello dei macronutrienti (proteine, carboidrati, grassi, energia) con la fiamma della serie -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7a55"/>
      <stop offset=".55" stop-color="#0d4f5c"/>
      <stop offset="1" stop-color="#1d2a78"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff3d6"/>
    </linearGradient>
  </defs>
  <rect class="tile" width="1024" height="1024" fill="url(#bg)"/>
  <rect class="tile" width="1024" height="1024" fill="url(#glow)"/>
  <g fill="none" stroke-width="104" stroke-linecap="round" transform="rotate(-90 512 512)">
    <!-- 4 archi uguali, piccoli spazi sulle diagonali: circonferenza r=286 -> 1797 -->
    <circle cx="512" cy="512" r="286" stroke="#3ee59b" stroke-dasharray="305 1492" stroke-dashoffset="-72.1"/>
    <circle cx="512" cy="512" r="286" stroke="#ffc83a" stroke-dasharray="305 1492" stroke-dashoffset="-521.4"/>
    <circle cx="512" cy="512" r="286" stroke="#ff6a45" stroke-dasharray="305 1492" stroke-dashoffset="-970.6"/>
    <circle cx="512" cy="512" r="286" stroke="#53a9ff" stroke-dasharray="305 1492" stroke-dashoffset="-1419.9"/>
  </g>
  <path transform="translate(512 500) scale(1.32) translate(-512 -490)" fill="url(#flame)" d="M512 330c14 72 92 112 92 210 0 62-41 112-92 112s-92-50-92-112c0-46 22-74 44-94 4 34 20 54 40 58-14-52-12-116 8-174z"/>
</svg>
